name: Auto Instagram Reel Bot

on:
  schedule:
    # हर 30 मिनट में यह बॉट अपने आप बैकग्राउंड में चलेगा
    - cron: '*/59 * * * *'
  workflow_dispatch: # इससे आप GitHub वेबसाइट पर मैन्युअली बटन दबाकर भी चला सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick
        # GitHub Actions पर TextClip की सुरक्षा नीतियों (Policy Errors) को फिक्स करने का कमांड
        sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml
        sudo sed -i 's/domain="path" rights="none"/domain="path" rights="read|write"/' /etc/ImageMagick-6/policy.xml

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install instagrapi moviepy imageio-ffmpeg Pillow==9.5.0; fi

    - name: Run Bot
      env:
        INSTA_SESSION_ID: ${{ secrets.INSTA_SESSION_ID }}
      run: |
        python bot.py

    - name: Commit State File Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        # अपलोड के बाद यह कमांड गिटहब पर 'trading_state.json' फाइल को खुद ही सेव (Update) कर देगी
        git add trading_state.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update video state history" && git push)
